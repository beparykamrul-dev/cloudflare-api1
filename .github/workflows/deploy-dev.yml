name: Deploy Dev

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: FTN deployment ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ftn-development-${{ inputs.deployment_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - name: Package release
        run: tar -czf ftn-cloudflare-api-${GITHUB_SHA}.tar.gz package.json dist config scripts README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ftn-cloudflare-api-dev-${{ github.sha }}
          path: ftn-cloudflare-api-${{ github.sha }}.tar.gz

  callback:
    if: always()
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Verify deployed health
        id: health
        if: needs.build.result == 'success'
        continue-on-error: true
        env:
          FTN_DEPLOY_HEALTH_URL: ${{ secrets.FTN_DEPLOY_HEALTH_URL }}
        run: |
          set -eu
          test -n "$FTN_DEPLOY_HEALTH_URL"
          curl --fail --silent --show-error --max-time 15 "${FTN_DEPLOY_HEALTH_URL%/}/health/ready" >/dev/null
      - name: Send signed deployment callback
        if: always()
        env:
          FTN_DEPLOY_CALLBACK_URL: ${{ secrets.FTN_DEPLOY_CALLBACK_URL }}
          FTN_DEPLOY_CALLBACK_SECRET: ${{ secrets.FTN_DEPLOY_CALLBACK_SECRET }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          REPOSITORY: ${{ github.repository }}
          SERVICE_ID: ftn-cloudflare-api
          ENVIRONMENT: development
          COMMIT_SHA: ${{ github.sha }}
          JOB_RESULT: ${{ needs.build.result }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: |
          set -eu
          test -n "$FTN_DEPLOY_CALLBACK_URL"
          test -n "$FTN_DEPLOY_CALLBACK_SECRET"
          status="failed"
          health_status="unknown"
          if [ "$JOB_RESULT" = "success" ] && [ "$HEALTH_OUTCOME" = "success" ]; then
            status="succeeded"
            health_status="healthy"
          elif [ "$JOB_RESULT" = "success" ]; then
            health_status="unhealthy"
          fi
          payload="$(jq -cn --arg deployment_id "$DEPLOYMENT_ID" --arg repository "$REPOSITORY" --arg service_id "$SERVICE_ID" --arg environment "$ENVIRONMENT" --arg status "$status" --arg health_status "$health_status" --arg version "$COMMIT_SHA" '{deployment_id:$deployment_id,repository:$repository,service_id:$service_id,environment:$environment,status:$status,health_status:$health_status,version:$version}')"
          signature="$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$FTN_DEPLOY_CALLBACK_SECRET" -hex | awk '{print $2}')"
          curl --fail --silent --show-error --max-time 15 \
            -X POST "$FTN_DEPLOY_CALLBACK_URL" \
            -H 'content-type: application/json' \
            -H "x-ftn-signature-256: sha256=$signature" \
            --data-binary "$payload"