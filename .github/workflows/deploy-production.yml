name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run validate:config
      - name: Package immutable release
        run: tar -czf ftn-cloudflare-api-${GITHUB_SHA}.tar.gz package.json package-lock.json dist config scripts README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ftn-cloudflare-api-production-${{ github.sha }}
          path: ftn-cloudflare-api-${{ github.sha }}.tar.gz
