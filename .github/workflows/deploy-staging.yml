name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        type: choice
        options: [development, staging, production]
      deployment_id:
        description: FTN deployment ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ftn-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run validate:config
      - name: Package release
        run: tar -czf ftn-cloudflare-api-${GITHUB_SHA}.tar.gz package.json package-lock.json dist config scripts README.md
      - uses: actions/upload-artifact@v4
        with:
          name: ftn-cloudflare-api-staging-${{ github.sha }}
          path: ftn-cloudflare-api-${{ github.sha }}.tar.gz
